<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雀鸣</title>
<style>
body{background:#1b1d1a;color:#ddd8c8;font-family:-apple-system,"PingFang SC",sans-serif;margin:0;display:flex;flex-direction:column;align-items:center}
h1{font-weight:400;font-size:20px;margin:14px 0 4px}
p.s{margin:2px 0;font-size:13px;color:#a9a48f;max-width:740px;line-height:1.6}
#top{display:flex;gap:18px;align-items:center;margin:8px 0;font-size:15px}
button{background:#33362f;color:#ddd8c8;border:1px solid #555a4c;border-radius:5px;padding:5px 12px;font-size:14px;cursor:pointer}
button:hover{background:#43473c}
canvas{display:block;cursor:crosshair}
#msg{min-height:22px;font-size:14px;color:#f0d78a;margin:6px}
.b{display:inline-block;width:12px;height:12px;border-radius:6px;background:#f0c040;margin-right:3px;vertical-align:-1px}
.b.used{background:#444}
</style></head><body>
<h1>雀鸣</h1>
<p class="s">一种麻雀，西边的唱新歌（金色），东边的唱老歌（绿色）。小鸟跟着身边听到多的学。冬天它们飞到南边几片地方过冬，混住在一起，冬天听到的也算。</p>
<p class="s">你有几口气（第一张图四口，第二张三口，第三张也是三口）。春天点一下地图，就在那儿对今年的小鸟吹一遍新歌。让新歌从西唱到东，唱遍整片地方（每一列都过半）。吹完了别急，有时候要等十几二十年才看得出吹没吹成。</p>
<div id="top"><span id="lvn"></span><span>第 <b id="yr">0</b> 年</span><span id="br"></span>
<button id="go">开始</button><button id="re">从头</button><button id="lv"></button>
<label style="font-size:13px"><input type="checkbox" id="sh"> 看过冬地</label><label style="font-size:13px"><input type="checkbox" id="fast"> 快</label></div>
<canvas id="cv"></canvas>
<div id="msg"></div>
<p class="s" id="note" style="color:#c8b878"></p>
<p class="s" id="leg">底下那几格是几片过冬地，冬天在那儿听到的新歌有几成；它们各管地图上哪一块，卡住了可以勾上"看过冬地"。前两张图里，山西边的鸟有四成翻过山，去过冬地二过冬。</p>
<script src="sim.js"></script>
<script>
const Q=window.Que, C=26, cv=document.getElementById('cv'), g=cv.getContext('2d');
const MAPH=Q.H*C, WINH=70;
cv.width=Q.W*C; cv.height=MAPH+WINH+10;
const LV=[{map:'直',br:4,name:'第一张图'},{map:'弯',br:3,name:'第二张图'},{map:'真',br:3,name:'第三张图',q:0.45,note:'这张图照真鸟画的：西边和中部的鸟都去美国中南部同一大片地方过冬，山西边的鸟有四成多也去；东边的鸟去佐治亚，自己一片。'}];let lv=0,BREATHS=4,P=Q.P0;const LIMIT=200;
let f,yr,left,run,timer,marks,done,hist,hov=null;
function reset(){Q.useMap(LV[lv].map);BREATHS=LV[lv].br;P=Object.assign({},Q.P0,LV[lv].q!==undefined?{q:LV[lv].q}:{});document.getElementById('lv').textContent='换到'+LV[(lv+1)%LV.length].name;document.getElementById('note').textContent=LV[lv].note||'';f=Q.fresh();yr=0;left=BREATHS;run=false;done=false;marks=[];hist=[];clearInterval(timer);
  document.getElementById('go').textContent='开始';msg('');draw();}
function msg(s){document.getElementById('msg').textContent=s;}
function col(v){ // 绿(老) -> 金(新)
  const a=[70,110,70],b=[240,192,64];
  return `rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*v)).join(',')})`;}
function draw(){
  g.fillStyle='#1b1d1a';g.fillRect(0,0,cv.width,cv.height);
  for(let y=0;y<Q.H;y++)for(let x=0;x<Q.W;x++){g.fillStyle=col(f[y][x]);g.fillRect(x*C,y*C,C-1,C-1);}
  // 山
  g.fillStyle='rgba(120,90,60,0.85)';
  for(let y=0;y<Q.H;y++){g.beginPath();g.moveTo(Q.ROCK*C-5,y*C+C);g.lineTo(Q.ROCK*C+2,y*C+3);g.lineTo(Q.ROCK*C+9,y*C+C);g.fill();}
  for(const m of marks){g.strokeStyle='rgba(255,255,255,'+Math.max(0.15,1-(yr-m.t)/20)+')';g.lineWidth=2;g.strokeRect((m.x-1)*C+1,(m.y-1)*C+1,3*C-3,3*C-3);}
  if(hov&&left>0&&!done){const [hx,hy]=hov;
    for(let y=hy-1;y<=hy+1;y++)for(let x=hx-1;x<=hx+1;x++){if(x<0||x>=Q.W||y<0||y>=Q.H)continue;
      if(f[y][x]>0.5){g.strokeStyle='rgba(220,60,50,0.9)';g.lineWidth=2;g.beginPath();g.moveTo(x*C+6,y*C+6);g.lineTo(x*C+C-7,y*C+C-7);g.stroke();g.beginPath();g.moveTo(x*C+C-7,y*C+6);g.lineTo(x*C+6,y*C+C-7);g.stroke();}
      else{g.fillStyle='rgba(255,240,200,0.35)';g.fillRect(x*C,y*C,C-1,C-1);}}
    g.strokeStyle='rgba(255,250,230,0.9)';g.lineWidth=1.5;g.strokeRect((hx-1)*C+0.5,(hy-1)*C+0.5,3*C-2,3*C-2);}
  const sh=document.getElementById('sh').checked;
  const pm=Q.pools(f,P);
  const present=[];for(let b=0;b<Q.NB;b++){let k=false;for(let y=0;y<Q.H&&!k;y++)for(let x=0;x<Q.W;x++)if(Q.reg(x,y)===b){k=true;break;}if(k)present.push(b);}
  const ord={};present.forEach((b,i)=>ord[b]=i);
  if(sh){g.strokeStyle='rgba(255,255,255,0.55)';g.lineWidth=2;
    for(let y=0;y<Q.H;y++)for(let x=0;x<Q.W;x++){const r=Q.reg(x,y);
      if(x+1<Q.W&&Q.reg(x+1,y)!==r&&x+1!==Q.ROCK){g.beginPath();g.moveTo((x+1)*C-0.5,y*C);g.lineTo((x+1)*C-0.5,(y+1)*C);g.stroke();}
      if(y+1<Q.H&&Q.reg(x,y+1)!==r){g.beginPath();g.moveTo(x*C,(y+1)*C-0.5);g.lineTo((x+1)*C,(y+1)*C-0.5);g.stroke();}}
    g.fillStyle='rgba(255,255,255,0.5)';g.font='13px sans-serif';
    const seen={};for(let y=0;y<Q.H;y++)for(let x=0;x<Q.W;x++){const r=Q.reg(x,y);(seen[r]=seen[r]||[]).push([x,y]);}
    for(const r in seen){const c=seen[r][Math.floor(seen[r].length/2)];g.fillText('一二三四五'[ord[r]],c[0]*C+7,c[1]*C+18);}
  }
  // 过冬地
  const y0=MAPH+10, bw=cv.width/present.length;
  for(let i=0;i<present.length;i++){const b=present[i];
    const x0=i*bw,x1=(i+1)*bw;
    g.fillStyle='#262923';g.fillRect(x0+3,y0,x1-x0-6,WINH-10);
    {const hh=(WINH-14)*Math.max(pm[b],0.03);g.fillStyle=col(pm[b]);g.fillRect(x0+3,y0+WINH-10-hh,x1-x0-6,hh);
      g.fillStyle='#ddd8c8';g.font='12px sans-serif';g.fillText(sh?`过冬地${'一二三四五'[i]}`:'过冬地 ?',x0+8,y0+16);g.fillText(`${Math.round(pm[b]*100)}% 新歌`,x0+8,y0+32);}
  }
  document.getElementById('lvn').textContent=LV[lv].name;
  document.getElementById('yr').textContent=yr;
  document.getElementById('br').innerHTML='气 '+Array.from({length:BREATHS},(_,i)=>`<span class="b ${i<BREATHS-left?'used':''}"></span>`).join('');
}
function tick(){
  if(done)return;

  f=Q.step(f,P);yr++;
  let all=true;for(let x=0;x<Q.W;x++)if(Q.colmean(f,x)<=0.5){all=false;break;}
  if(all){done=true;stop();msg(`第 ${yr} 年，从西到东都唱起了新歌。用了 ${BREATHS-left} 口气。`);}
  else if(yr>=LIMIT){done=true;stop();msg(`${LIMIT} 年过去了，还有地方在唱老歌。`);}
  draw();
}
function stop(){run=false;clearInterval(timer);document.getElementById('go').textContent='接着';}
document.getElementById('go').onclick=()=>{if(done)return;if(run){stop();return;}run=true;document.getElementById('go').textContent='停';timer=setInterval(tick,document.getElementById('fast').checked?50:180);};
document.getElementById('fast').onchange=()=>{if(run){clearInterval(timer);timer=setInterval(tick,document.getElementById('fast').checked?50:180);}};
document.getElementById('re').onclick=reset;
document.getElementById('lv').onclick=()=>{lv=(lv+1)%LV.length;reset();};
document.getElementById('sh').onchange=draw;
cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*cv.width/r.width/C),y=Math.floor((e.clientY-r.top)*cv.height/r.height/C);
  const n=(y<Q.H&&x>=0&&x<Q.W)?[x,y]:null;if(String(n)!==String(hov)){hov=n;if(!run)draw();}};
cv.onmouseleave=()=>{hov=null;if(!run)draw();};
cv.onclick=e=>{
  const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*cv.width/r.width/C),y=Math.floor((e.clientY-r.top)*cv.height/r.height/C);
  if(y>=Q.H||x<0||x>=Q.W||done)return;
  if(left<=0){msg('气用完了。');return;}
  let w=0;for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++)if(xx>=0&&xx<Q.W&&yy>=0&&yy<Q.H&&f[yy][xx]>0.5)w++;
  Q.blow(f,x,y);left--;marks.push({x,y,t:yr});
  msg(w?`这一口有 ${w} 格吹在已经唱新歌的鸟身上，那几格白吹了。`:'');draw();
};
reset();
</script></body></html>
